{% load portfolio_content %}
{% if value.quote|filled %}
  <section class="block project-testimonial">
    <p class="eyebrow">{{ portfolio_site_settings.project_testimonial_label }}</p>
    <figure class="quote">
      <blockquote><p>„{{ value.quote|linebreaksbr }}“</p></blockquote>
      {% if value.name|filled %}<figcaption>{{ value.name }}{% if value.role|filled %} · {{ value.role }}{% endif %}</figcaption>{% endif %}
    </figure>
  </section>
{% endif %}
